name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # v0.46.0 (t8u): Stable never ships a prerelease. A version like 0.46.0-beta.1 on master is served only by steph1420/sow-beta.
  gate:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.v.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(node -p "require('./package.json').version")
          if echo "$V" | grep -q -- '-'; then echo "stable=false" >> "$GITHUB_OUTPUT"; echo "::notice::$V is a prerelease — Stable Pages not deployed (Beta site: steph1420/sow-beta)"; else echo "stable=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
